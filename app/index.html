<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nn-anatomy 神经网络解剖教室</title>
  <link rel="stylesheet" href="src/ui/app.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    window.addEventListener('error', function (e) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#d93025;color:#fff;font:12px monospace;padding:6px 10px;white-space:pre-wrap';
      d.textContent = 'JS ERROR: ' + (e.message || e.error) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '');
      document.body.appendChild(d);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b45309;color:#fff;font:12px monospace;padding:6px 10px;white-space:pre-wrap';
      d.textContent = 'PROMISE REJECT: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason);
      document.body.appendChild(d);
    });
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
