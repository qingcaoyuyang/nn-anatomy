[package]
name = "nn-anatomy"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"

[dev-dependencies]
tempdir = "0.3"

# Build bottleneck workaround: this machine's 16GB RAM cannot link the full
# Tauri test binary with debug info (rustc was OOM-killed at 8+ minutes).
# Keep this in place until the test suite is split from the app target.
[profile.dev]
debug = 0

[profile.test]
debug = 0
